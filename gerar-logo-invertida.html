<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerar logo invertida</title>
<style>
  body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:24px;background:#888;}
  canvas{border:1px solid #ccc;max-width:400px;}
  a.btn{padding:14px 32px;background:#0A6FC0;color:#fff;text-decoration:none;font-weight:700;font-size:0.9rem;border-radius:4px;}
  p{color:#fff;font-size:0.85rem;text-align:center;max-width:440px;}
</style>
</head>
<body>
<p>Coloque este arquivo na mesma pasta que <strong>giacomoponte.png</strong> e abra no navegador.</p>
<canvas id="c"></canvas>
<a class="btn" id="dl" download="giacomoponte-invertida.png">Baixar PNG invertida</a>
<script>
const img = new Image();
img.src = 'giacomoponte.png';
img.onload = () => {
  const c = document.getElementById('c');
  c.width  = img.naturalWidth;
  c.height = img.naturalHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, c.width, c.height);
  const px = data.data;
  for (let i = 0; i < px.length; i += 4) {
    if (px[i+3] > 0) {           // só inverte pixels visíveis
      px[i]   = 255 - px[i];     // R
      px[i+1] = 255 - px[i+1];   // G
      px[i+2] = 255 - px[i+2];   // B
    }
  }
  ctx.putImageData(data, 0, 0);
  document.getElementById('dl').href = c.toDataURL('image/png');
};
img.onerror = () => alert('Coloque este arquivo na mesma pasta que giacomoponte.png e tente novamente.');
</script>
</body>
</html>
